name: Refresh snapshot

on:
  schedule:
    - cron: "7 * * * *"           # hourly (UTC) - change to "*/30 * * * *" for every 30 min
  workflow_dispatch:            # lets you refresh on demand from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", "templates/**"]

permissions:
  contents: write               # needed to commit the refreshed snapshot

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest numbers
        # bakes the full Category x Sector matrix so the static site can filter offline (~2 min)
        env:
          BAKE_MATRIX: "1"
        run: python3 scripts/fetch_snapshot.py --matrix

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Commit if changed
        run: |
          git config user.name  "seva-tracker-bot"
          git config user.email "seva-tracker-bot@users.noreply.github.com"
          git add docs/ data/history.jsonl
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            S=$(python3 -c "import json;d=json.load(open('docs/data/snapshot.json'))['submissions'];print(d['total_submissions'])" 2>/dev/null || echo "?")
            git commit -m "chore: refresh snapshot (submissions: ${S})"
            git push
          fi
